<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F766E">
  <title>العربية — Media Pembelajaran Bahasa Arab Interaktif</title>
  <meta name="description" content="Media pembelajaran bahasa Arab interaktif untuk SMA Islam Assyafiiyah 02. Dialog, kosakata, dan latihan soal.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="icon" href="assets/images/logo-mark.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arabiyya">
  <link rel="apple-touch-icon" href="assets/images/logo-mark.svg">
</head>
<body>
  <div id="root"></div>

  <!-- ═══ Runtime: React (Babel tidak lagi diperlukan) ═══ -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
          crossorigin="anonymous"></script>

  <!-- ═══ TTS Helper ═══ -->
  <script src="dist/js/lib/tts.js"></script>

  <!-- ═══ Speech Recognition Helper ═══ -->
  <script src="dist/js/lib/speechRecognition.js"></script>

  <!-- ═══ Spaced Repetition (SM-2) ═══ -->
  <script src="dist/js/lib/srs.js"></script>

  <!-- ═══ Supabase ═══ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="dist/js/lib/supabase.js"></script>

  <!-- ═══ Data ═══ -->
  <script src="dist/js/data.js"></script>

  <!-- ═══ Hooks ═══ -->
  <script src="dist/js/hooks/useProgress.js"></script>
  <script src="dist/js/hooks/useAuth.js"></script>
  <script src="dist/js/hooks/useCloudProgress.js"></script>
  <script src="dist/js/hooks/useCloudContent.js"></script>
  <script src="dist/js/hooks/useQuizTimer.js"></script>

  <!-- ═══ UI Primitives (order matters: dependencies first) ═══ -->
  <script src="dist/js/components/Icon.js"></script>
  <script src="dist/js/components/Card.js"></script>
  <script src="dist/js/components/Button.js"></script>
  <script src="dist/js/components/Badge.js"></script>
  <script src="dist/js/components/AudioButton.js"></script>
  <script src="dist/js/components/ProgressBar.js"></script>
  <script src="dist/js/components/Toast.js"></script>
  <script src="dist/js/components/SpeakButton.js"></script>

  <!-- ═══ Layout Components ═══ -->
  <script src="dist/js/components/Navbar.js"></script>
  <script src="dist/js/components/ChapterCard.js"></script>
  <script src="dist/js/components/SectionCard.js"></script>
  <script src="dist/js/components/DialogueBubble.js"></script>
  <script src="dist/js/components/QuizNavigator.js"></script>

  <!-- ═══ Screens ═══ -->
  <script src="dist/js/screens/LoginScreen.js"></script>
  <script src="dist/js/screens/NicknameScreen.js"></script>
  <script src="dist/js/screens/HomeScreen.js"></script>
  <script src="dist/js/screens/ChapterScreen.js"></script>
  <script src="dist/js/screens/HiwarScreen.js"></script>
  <script src="dist/js/screens/MufrodatScreen.js"></script>
  <script src="dist/js/screens/Tadribat1Screen.js"></script>
  <script src="dist/js/screens/QawaidScreen.js"></script>
  <script src="dist/js/screens/Tadribat2Screen.js"></script>
  <script src="dist/js/screens/ImtihanScreen.js"></script>
  <script src="dist/js/screens/AdminScreen.js"></script>

  <!-- ═══ App Entry ═══ -->
  <script src="dist/js/app.js"></script>

  <!-- ═══ Service Worker Registration ═══ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(() => { /* SW not critical — app still works without it */ });
      });
    }
  </script>
</body>
</html>
